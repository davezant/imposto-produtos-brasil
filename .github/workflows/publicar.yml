name: Publicar distribuição

# Na main: publica SQLite, JSON, CSV e a API estática no GitHub Pages.
# Em tags v* (ex.: v0.8.0): cria uma Release com os arquivos, para quem quer fixar uma versão.
# A Release fica num job separado porque o ambiente github-pages só aceita deploys da main.
# Requer: Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validar_dados.py
      - name: Gerar distribuição
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: python tools/gerar_distribuicao.py --saida dist --base-url "https://${OWNER}.github.io/${REPO}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages:
    if: github.ref == 'refs/heads/main'
    needs: gerar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: gerar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
      - name: Criar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist && tar -xf artifact.tar -C dist
          cd dist
          zip -qr ../impostos-csv.zip csv datapackage.json schema.json
          zip -qr ../impostos-json.zip json api schema.json llms.txt
          cd ..
          gh release create "${GITHUB_REF_NAME}" dist/impostos.sqlite impostos-csv.zip impostos-json.zip \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" \
            --notes "Veja o CHANGELOG.txt para as mudanças desta versão."
